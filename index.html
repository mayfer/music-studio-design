<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Studio — Three.js Walkthrough</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1814; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed; left: 1rem; bottom: 1rem; color: rgba(245,239,227,0.65);
      font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.72rem; z-index: 5;
      pointer-events: none; line-height: 1.6;
    }
    #panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
      background: rgba(22, 20, 17, 0.94); color: #ebe4d6;
      font-family: "Segoe UI", system-ui, sans-serif; font-size: 12.5px;
      z-index: 20; overflow-y: auto; overflow-x: hidden;
      border-left: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease;
    }
    #panel.collapsed { transform: translateX(100%); pointer-events: none; }
    #panel-toggle {
      position: fixed; top: 12px; right: 12px; z-index: 22;
      background: rgba(30, 28, 24, 0.92); color: #ebe4d6;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
      padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
      transition: right 0.25s ease;
    }
    #panel-toggle:hover { background: rgba(50, 46, 40, 0.95); }
    /* sit just left of the open panel so it never gets covered */
    body:not(.panel-collapsed) #panel-toggle { right: 312px; }
    body.panel-collapsed #panel-toggle { right: 12px; }
    #panel header {
      padding: 14px 16px 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: rgba(22, 20, 17, 0.98); z-index: 2;
    }
    #panel header h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; }
    #panel header .actions { display: flex; gap: 6px; }
    #panel header button {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #ebe4d6; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    #panel header button:hover { background: rgba(255,255,255,0.12); }
    .folder { border-bottom: 1px solid rgba(255,255,255,0.06); }
    .folder-title {
      padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #c9a66b; cursor: pointer; user-select: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    .folder-title:hover { background: rgba(255,255,255,0.03); }
    .folder-title .chev { opacity: 0.5; font-size: 10px; transition: transform 0.15s; }
    .folder.closed .folder-title .chev { transform: rotate(-90deg); }
    .folder.closed .folder-body { display: none; }
    .folder-body { padding: 4px 12px 12px; }
    .row {
      display: grid; grid-template-columns: 1fr 72px; gap: 8px; align-items: center;
      margin-bottom: 8px;
    }
    .row label { opacity: 0.8; font-size: 12px; }
    .row .value {
      text-align: right; font-variant-numeric: tabular-nums; opacity: 0.55; font-size: 11px;
      font-family: ui-monospace, monospace;
    }
    .row.full { grid-template-columns: 1fr; }
    input[type="range"] {
      width: 100%; grid-column: 1 / -1; accent-color: #c59c5d; height: 4px; cursor: pointer;
    }
    input[type="color"] {
      width: 100%; height: 28px; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; background: transparent; cursor: pointer; padding: 0;
    }
    .check-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer;
    }
    .check-row input { accent-color: #c59c5d; width: 14px; height: 14px; }
    .hint-text { opacity: 0.4; font-size: 10.5px; line-height: 1.4; margin: 4px 0 8px; }
    .choice-row { margin-bottom: 10px; }
    .choice-row > label { display: block; opacity: 0.8; font-size: 12px; margin-bottom: 6px; }
    .choice-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .choice-btns button {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
      color: #ebe4d6; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer;
    }
    .choice-btns button:hover { background: rgba(255,255,255,0.12); }
    .choice-btns button.active {
      background: rgba(197,156,93,0.35); border-color: #c59c5d; color: #fff;
    }
    #toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: rgba(30,28,24,0.95); color: #ebe4d6; padding: 8px 14px;
      border-radius: 8px; font-size: 12px; z-index: 30; opacity: 0;
      transition: opacity 0.25s; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="hud">Click scene to walk · WASD · mouse look · Esc · P / Params to toggle panel</div>
  <button id="panel-toggle" type="button" title="Toggle parameters (P)">Params</button>
  <div id="panel"></div>
  <div id="toast"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

RectAreaLightUniformsLib.init();

// ═══════════════════════════════════════════════════════════════════
const WT = 0.18; // wall thickness (clean butt joints)

const DEFAULTS = {
  roomWidth: 19,
  roomDepth: 18,
  eavesHeight: 8,
  peakHeight: 11,

  windowWidth: 5,
  windowHeight: 50 / 12,
  windowGap: 16 / 12,
  windowSill: 3.0,
  showWindows: true,

  doorWidth: 3.0,
  doorHeight: 6.75,
  doorFromFront: 1.2,
  showDoor: true,

  bathWidth: 5.5,
  bathDepth: 9,
  bathHeight: 7.15,
  bathDoorWidth: 2.5,      // ~30"
  bathDoorHeight: 6.7,     // ~80"
  // Door on bathroom wall facing the main entry door (x1 = toward windows / right wall)
  // along: 0 = at window wall, 1 = far end into room
  bathDoorAlong: 0.45,
  bathWindowGap: 2 / 12,   // 2"
  bathDoorOpen: 0.85,      // 0=closed … 1≈open into bath
  showBathroom: true,
  showBathDoor: true,

  // Acoustic panels — standard sizes only (ft): width 12|24, height 24|48
  showWallPanels: true,
  panelWidth: 2,          // 24"  (12 or 24)
  panelHeight: 4,         // 48"  (24 or 48)
  panelThickness: 0.18,
  panelGap: 0.35,
  panelBottom: 1.5,
  panelMargin: 0.75,
  showHorizontalGablePanels: true,

  // Bass traps — width 12|24, height 48 each; stack 2 for floor→ceiling
  showBassTraps: true,
  showBassTrapDoorCorner: false,   // entry-door corner — off by default
  showBassTrapBathCorner: true,    // exterior corner of bathroom into room
  twoBassTrapsPerCorner: true,
  trapWidth: 1,           // 12" or 24" (1 or 2 ft)
  trapHeight: 4,          // 48" fixed per unit
  trapThickness: 0.55,
  trapBottom: 0.0,

  // Ceiling clouds (hanging)
  showClouds: true,
  cloudWidth: 4,
  cloudDepth: 2,
  cloudThickness: 0.2,
  cloudHang: 1.4,
  cloudGap: 0.5,
  cloudMargin: 0.5,
  cloudWireLen: 1.2,

  // Vault ceiling panels — 4 per slope (2×2), landscape (long edge along room / parallel to ridge)
  showVaultPanels: true,
  vaultPanelAlong: 2,     // 24" along slope (short)
  vaultPanelAcross: 4,    // 48" along room depth (long) — landscape
  vaultPanelThickness: 0.15,
  vaultPanelGap: 0.35,
  vaultPanelMargin: 0.75,

  // bare bulbs hang on ridge centerline (x = 0)
  bulb1X: 0, bulb1Z: -3.5,
  bulb2X: 0, bulb2Z: 3.5,
  bulbIntensity: 32,
  windowLightIntensity: 5.5,
  ambientIntensity: 0.28,
  sunIntensity: 0.95,

  colorCeiling: '#c59c5d',
  colorWalls: '#f1e6ca',
  colorFloor: '#d5cfc0',
  colorFrame: '#faf8f4',
  colorWallPanel: '#f1e6ca',   // default match walls
  colorCeilingPanel: '#e8d9b8',
  colorVaultPanel: '#f1e6ca',  // Matchstick — on vaulted ceiling
  colorBassTrap: '#e5d9c0',

  eyeHeight: 5.35,
  walkSpeed: 6.5,
  sprintSpeed: 13,
};

const P = { ...DEFAULTS };
const STORAGE_KEY = 'music-studio-params-v10';
const REPO_PARAMS_FILE = 'studio-params.json';

function applyParamObject(obj) {
  if (!obj || typeof obj !== 'object') return;
  for (const k of Object.keys(DEFAULTS)) {
    if (obj[k] !== undefined) P[k] = obj[k];
  }
}

function paramsForExport() {
  const out = {};
  for (const k of Object.keys(DEFAULTS)) out[k] = P[k];
  return out;
}

function exportParamsJSON() {
  return JSON.stringify(paramsForExport(), null, 2) + '\n';
}

function saveParams() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(paramsForExport()));
  } catch (_) {}
}

function loadLocalParams() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;
    applyParamObject(JSON.parse(saved));
    return true;
  } catch (_) {
    return false;
  }
}

/** Shared repo defaults — paste Export JSON into studio-params.json and commit */
async function loadRepoParams() {
  try {
    const res = await fetch(REPO_PARAMS_FILE, { cache: 'no-store' });
    if (!res.ok) return false;
    const data = await res.json();
    // empty {} is fine — means “use code defaults”
    if (data && typeof data === 'object' && Object.keys(data).length > 0) {
      applyParamObject(data);
      return true;
    }
  } catch (_) {
    // file:// or missing file — ignore
  }
  return false;
}

function downloadParamsJSON() {
  const blob = new Blob([exportParamsJSON()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = REPO_PARAMS_FILE;
  a.click();
  URL.revokeObjectURL(url);
}

// persist even if a control path forgot to save
addEventListener('pagehide', saveParams);
addEventListener('beforeunload', saveParams);

// ═══════════════════════════════════════════════════════════════════
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.08, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const world = new THREE.Group();
scene.add(world);

let colliders = [];
let bulbLights = [];
let mats = {};
let fabricTextures = null; // cached generative maps
let exteriorTex = null;    // garden/house photo outside windows

function ensureExteriorTexture() {
  if (exteriorTex) return exteriorTex;
  // cache-bust so a replaced exterior.jpg always reloads
  exteriorTex = new THREE.TextureLoader().load(
    `exterior.jpg?v=${Date.now()}`,
    () => requestRender(),
    undefined,
    () => console.warn('Could not load exterior.jpg')
  );
  exteriorTex.colorSpace = THREE.SRGBColorSpace;
  exteriorTex.anisotropy = 8;
  return exteriorTex;
}

function hex(c) { return new THREE.Color(c); }

// ── fabric maps sized for a 24"×48" panel (aspect 1:2), fully seamless ──
// Texture U = 24", V = 48". Map once onto a 2'×4' face with repeat (1,1).
function makeFabricTextures() {
  if (fabricTextures) return fabricTextures;

  // 256×512 ≈ 24×48 aspect (1:2)
  const W = 256;
  const Hgt = 512;
  const H = new Float32Array(W * Hgt);

  // tileable value noise on integer grid
  function hash2(ix, iy) {
    const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function vnoise(px, py, cellsX, cellsY) {
    // px,py in [0,1) over full texture; cells = periods
    const x = px * cellsX;
    const y = py * cellsY;
    const x0 = Math.floor(x);
    const y0 = Math.floor(y);
    const fx = x - x0;
    const fy = y - y0;
    const x1 = (x0 + 1) % cellsX;
    const y1 = (y0 + 1) % cellsY;
    const xa = ((x0 % cellsX) + cellsX) % cellsX;
    const ya = ((y0 % cellsY) + cellsY) % cellsY;
    const sx = fx * fx * (3 - 2 * fx);
    const sy = fy * fy * (3 - 2 * fy);
    const a = hash2(xa, ya);
    const b = hash2(x1, ya);
    const c = hash2(xa, y1);
    const d = hash2(x1, y1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }

  for (let y = 0; y < Hgt; y++) {
    for (let x = 0; x < W; x++) {
      const u = x / W;
      const v = y / Hgt;
      // integer-period warp/weft (seamless)
      const warp = Math.sin(u * Math.PI * 2 * 48); // 48 cycles across 24"
      const weft = Math.sin(v * Math.PI * 2 * 96); // denser along 48"
      const basket = Math.abs(warp) * Math.abs(weft);
      // tileable fibre noise
      const n1 = vnoise(u, v, 32, 64);
      const n2 = vnoise(u, v, 64, 128);
      const n3 = vnoise(u, v, 16, 32);
      let h = 0.5
        + basket * 0.18
        + (n1 - 0.5) * 0.22
        + (n2 - 0.5) * 0.12
        + (n3 - 0.5) * 0.08;
      h = Math.min(1, Math.max(0, h));
      H[y * W + x] = h;
    }
  }

  function fillCanvas(fromHeight, mapFn) {
    const c = document.createElement('canvas');
    c.width = W;
    c.height = Hgt;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(W, Hgt);
    for (let y = 0; y < Hgt; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        const rgb = mapFn(fromHeight[y * W + x], x, y);
        img.data[i] = rgb[0];
        img.data[i + 1] = rgb[1];
        img.data[i + 2] = rgb[2];
        img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  const hCanvas = fillCanvas(H, (h) => {
    const g = (h * 255) | 0;
    return [g, g, g];
  });

  // normals with wrap
  const strength = 2.8;
  const nCanvas = document.createElement('canvas');
  nCanvas.width = W;
  nCanvas.height = Hgt;
  const nctx = nCanvas.getContext('2d');
  const nImg = nctx.createImageData(W, Hgt);
  for (let y = 0; y < Hgt; y++) {
    for (let x = 0; x < W; x++) {
      const xl = H[y * W + ((x - 1 + W) % W)];
      const xr = H[y * W + ((x + 1) % W)];
      const yd = H[((y - 1 + Hgt) % Hgt) * W + x];
      const yu = H[((y + 1) % Hgt) * W + x];
      let nx = (xl - xr) * strength;
      let ny = (yd - yu) * strength;
      let nz = 1.0;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      const i = (y * W + x) * 4;
      nImg.data[i] = ((nx * 0.5 + 0.5) * 255) | 0;
      nImg.data[i + 1] = ((ny * 0.5 + 0.5) * 255) | 0;
      nImg.data[i + 2] = ((nz * 0.5 + 0.5) * 255) | 0;
      nImg.data[i + 3] = 255;
    }
  }
  nctx.putImageData(nImg, 0, 0);

  const aCanvas = fillCanvas(H, (h) => {
    const v = (0.84 + h * 0.18) * 255;
    return [v, v, v];
  });
  const rCanvas = fillCanvas(H, (h) => {
    const v = ((0.78 + (1 - h) * 0.18) * 255) | 0;
    return [v, v, v];
  });

  function mk(c, srgb = false) {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  fabricTextures = {
    map: mk(aCanvas, true),
    normalMap: mk(nCanvas),
    roughnessMap: mk(rCanvas),
    bumpMap: mk(hCanvas),
  };
  return fabricTextures;
}

/**
 * Fabric material. Texture covers a 24"×48" (2'×4') panel at repeat (1,1).
 * Pass physical size in feet so weave density stays consistent.
 */
function fabricMat(colorHex, sizeWft = 2, sizeHft = 4) {
  const tex = makeFabricTextures();
  const uRep = sizeWft / 2; // 24" base
  const vRep = sizeHft / 4; // 48" base
  const mat = new THREE.MeshStandardMaterial({
    color: hex(colorHex),
    map: tex.map.clone(),
    normalMap: tex.normalMap.clone(),
    roughnessMap: tex.roughnessMap.clone(),
    bumpMap: tex.bumpMap.clone(),
    bumpScale: 0.018,
    normalScale: new THREE.Vector2(0.7, 0.7),
    roughness: 0.92,
    metalness: 0.0,
  });
  for (const t of [mat.map, mat.normalMap, mat.roughnessMap, mat.bumpMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(uRep, vRep);
    t.needsUpdate = true;
  }
  mat.map.colorSpace = THREE.SRGBColorSpace;
  return mat;
}

function makeMaterials() {
  mats = {
    wall: new THREE.MeshStandardMaterial({
      color: hex(P.colorWalls), roughness: 0.9, metalness: 0.02, side: THREE.FrontSide
    }),
    ceil: new THREE.MeshStandardMaterial({ color: hex(P.colorCeiling), roughness: 0.7, metalness: 0.05, side: THREE.DoubleSide }),
    floor: new THREE.MeshStandardMaterial({ color: hex(P.colorFloor), roughness: 0.88 }),
    frame: new THREE.MeshStandardMaterial({
      color: hex(P.colorFrame), roughness: 0.42, metalness: 0.06,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2
    }),
    trim: new THREE.MeshStandardMaterial({ color: 0xf5f2eb, roughness: 0.55, metalness: 0.04 }),
    glass: new THREE.MeshStandardMaterial({
      color: 0xdce8f0, metalness: 0.05, roughness: 0.05,
      transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false
    }),
    door: new THREE.MeshStandardMaterial({
      color: 0xece9e2, roughness: 0.62,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
    }),
    metal: new THREE.MeshStandardMaterial({ color: 0xb8b0a4, metalness: 0.75, roughness: 0.28 }),
    wire: new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7, roughness: 0.4 }),
    roof: new THREE.MeshStandardMaterial({ color: 0x7a6540, roughness: 0.92, side: THREE.DoubleSide }),
    // UV scaled to physical size so a 24×48 face gets exactly one texture tile
    wallPanel: fabricMat(P.colorWallPanel, panelW(), panelH()),
    ceilPanel: fabricMat(P.colorCeilingPanel, P.cloudDepth, P.cloudWidth),
    vaultPanel: fabricMat(
      P.colorVaultPanel,
      snapPanelSize(P.vaultPanelAlong, [1, 2]),
      snapPanelSize(P.vaultPanelAcross, [2, 4])
    ),
    bassTrap: fabricMat(P.colorBassTrap, trapW(), 4),
  };
}

function mesh(geo, mat, x, y, z, parent = world) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(w, h, d, mat, x, y, z, parent = world) {
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
}

function roofY(x, halfW) {
  return P.eavesHeight + (1 - Math.min(1, Math.abs(x) / halfW)) * (P.peakHeight - P.eavesHeight);
}

// ── Clean wall strips (butt-jointed; no overlapping corners) ──────
// Front/back walls run full width. Side walls stop short by WT so they meet cleanly.
function wallStripX(x0, x1, y0, y1, zCenter, mat = mats.wall) {
  const w = x1 - x0, h = y1 - y0;
  if (w < 0.02 || h < 0.02) return null;
  return box(w, h, WT, mat, (x0 + x1) / 2, (y0 + y1) / 2, zCenter);
}
function wallStripZ(z0, z1, y0, y1, xCenter, mat = mats.wall) {
  const d = z1 - z0, h = y1 - y0;
  if (d < 0.02 || h < 0.02) return null;
  return box(WT, h, d, mat, xCenter, (y0 + y1) / 2, (z0 + z1) / 2);
}

/** Bathroom / partition shell with proper exterior corner joins */
function buildShellWalls(x0, x1, z0, z1, h, openings) {
  // openings: { wall: 'x0'|'x1'|'z0'|'z1', a0, a1, y0, y1 }  a along the wall
  // Walls butt: X-walls run full span; Z-walls inset by WT/2 from each end
  const t = WT;
  const eps = t; // side walls stop before end walls

  function openRanges(wall) {
    return (openings || []).filter((o) => o.wall === wall);
  }

  function buildWithOpenings(axis, a0, a1, y0, y1, place) {
    // place(segA0, segA1, segY0, segY1)
    const ops = openRanges(axis).map((o) => ({
      a0: Math.max(a0, o.a0), a1: Math.min(a1, o.a1), y0: o.y0, y1: o.y1
    })).filter((o) => o.a1 > o.a0).sort((a, b) => a.a0 - b.a0);

    // vertical full-height columns between openings
    let cur = a0;
    for (const op of ops) {
      if (op.a0 > cur) place(cur, op.a0, y0, y1);
      // below / above opening
      if (op.y0 > y0) place(op.a0, op.a1, y0, op.y0);
      if (op.y1 < y1) place(op.a0, op.a1, op.y1, y1);
      cur = op.a1;
    }
    if (cur < a1) place(cur, a1, y0, y1);
  }

  // end wall at z1 (into room) — full X span
  buildWithOpenings('z1', x0, x1, 0, h, (xa, xb, ya, yb) => {
    wallStripX(xa, xb, ya, yb, z1 - t / 2);
  });
  // window-wall side at z0 — usually closed / flush (no exterior)
  // skip solid at z0 — bathroom sits against room window wall

  // left wall x0 — Z span inset so it butts end wall
  buildWithOpenings('x0', z0, z1 - eps, 0, h, (za, zb, ya, yb) => {
    wallStripZ(za, zb, ya, yb, x0 + t / 2);
  });
  // right wall x1
  buildWithOpenings('x1', z0, z1 - eps, 0, h, (za, zb, ya, yb) => {
    wallStripZ(za, zb, ya, yb, x1 - t / 2);
  });

  // top plate / ceiling of shell
  box(x1 - x0 - 0.02, 0.08, z1 - z0 - 0.02, mats.wall,
    (x0 + x1) / 2, h, (z0 + z1) / 2);

  // clean corner caps (vertical beads) — optional thin fillets at exterior corners
  // outer corner at (x0, z1)
  const cap = 0.02;
  box(t + cap, h, t + cap, mats.wall, x0 + t / 2, h / 2, z1 - t / 2);
  box(t + cap, h, t + cap, mats.wall, x1 - t / 2, h / 2, z1 - t / 2);
}

/** A-frame gable: same thickness & material as rectangular walls, coplanar with them */
function gableFill(zCenter, halfW) {
  const shape = new THREE.Shape();
  // start slightly below eaves so it blends into the rectangle (no hairline gap)
  const yBase = P.eavesHeight - 0.04;
  shape.moveTo(-halfW, yBase);
  shape.lineTo(0, P.peakHeight);
  shape.lineTo(halfW, yBase);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: WT,
    bevelEnabled: false,
    steps: 1,
  });
  // ExtrudeGeometry goes +Z from the shape plane; center on zCenter
  geo.translate(0, 0, -WT / 2);
  // slight overlap into the rectangle below so no hairline seam at eaves
  // (shape already starts at eavesHeight; pull down a hair)
  const g = new THREE.Mesh(geo, mats.wall);
  g.position.z = zCenter;
  g.castShadow = true;
  g.receiveShadow = true;
  world.add(g);
}

function addCeilingQuad(x0, x1, halfD) {
  const y0 = P.eavesHeight, y1 = P.peakHeight;
  const z0 = -halfD, z1 = halfD;
  const geo = new THREE.BufferGeometry();
  const pos = x0 < x1
    ? new Float32Array([
        x0, y0, z0,  x0, y0, z1,  x1, y1, z1,
        x0, y0, z0,  x1, y1, z1,  x1, y1, z0,
      ])
    : new Float32Array([
        x0, y0, z0,  x1, y1, z0,  x1, y1, z1,
        x0, y0, z0,  x1, y1, z1,  x0, y0, z1,
      ]);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mats.ceil);
  m.receiveShadow = true;
  world.add(m);
}

function addRoofSkin(left, halfW, halfD) {
  const xE = left ? -halfW - 0.4 : halfW + 0.4;
  const yE = P.eavesHeight + 0.18, yP = P.peakHeight + 0.2;
  const z0 = -halfD - 0.45, z1 = halfD + 0.45;
  const geo = new THREE.BufferGeometry();
  const pos = left
    ? new Float32Array([
        xE, yE, z0,  0, yP, z0,  0, yP, z1,
        xE, yE, z0,  0, yP, z1,  xE, yE, z1,
      ])
    : new Float32Array([
        0, yP, z0,  xE, yE, z0,  xE, yE, z1,
        0, yP, z0,  xE, yE, z1,  0, yP, z1,
      ]);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mats.roof);
  m.castShadow = true;
  world.add(m);
}

/** Photo backdrop outside the window wall so both casements look onto the yard */
function placeExteriorBackdrop(zFront, wins) {
  const tex = ensureExteriorTexture();
  // size plane to cover windows while keeping a landscape photo aspect (~1.85)
  const winSpan = Math.max(wins.rightEdge - wins.leftEdge, P.windowWidth * 2) * 1.35;
  const aspect = 1346 / 724; // matches exterior.jpg
  let span = Math.max(winSpan, 12);
  let height = span / aspect;
  // ensure tall enough to cover window + a bit of sky/ground
  const minH = P.windowHeight * 2.2;
  if (height < minH) {
    height = minH;
    span = height * aspect;
  }
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    side: THREE.FrontSide,
    toneMapped: false,
  });
  // farther out for stronger parallax when walking past the windows
  const depth = 8;
  // scale up so the view still fills the glass from farther away
  span *= 1.65;
  height *= 1.65;

  const plane = new THREE.Mesh(new THREE.PlaneGeometry(span, height), mat);
  const midX = (wins.leftEdge + wins.rightEdge) / 2;
  // bias slightly down so deck/path sits naturally in the lower half of the view
  const midY = P.windowSill + P.windowHeight * 0.42;
  plane.position.set(midX, midY, zFront - depth);
  world.add(plane);

  // soft overcast fill beyond photo edges
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(span * 2.2, height * 1.8),
    new THREE.MeshBasicMaterial({ color: 0xa8b0b4, side: THREE.FrontSide })
  );
  sky.position.set(midX, midY, zFront - depth - 1.5);
  world.add(sky);
}

function casementWindow(cx, zFront) {
  const g = new THREE.Group();
  // thicker outer frame + thicker vertical center only (no horizontal mid-bar, no sill)
  const depth = 0.24;
  const ft = 0.15;    // outer frame ~1.8"
  const mull = 0.18;  // center vertical mullion thicker than frame
  const W = P.windowWidth, H = P.windowHeight;

  // outer frame: top, bottom, left, right
  box(W + ft * 2, ft, depth, mats.frame, 0, H + ft / 2, 0, g);
  box(W + ft * 2, ft, depth, mats.frame, 0, -ft / 2, 0, g);
  box(ft, H, depth, mats.frame, -W / 2 - ft / 2, H / 2, 0, g);
  box(ft, H, depth, mats.frame,  W / 2 + ft / 2, H / 2, 0, g);
  // vertical center only (two casement leaves)
  box(mull, H, depth * 0.95, mats.frame, 0, H / 2, 0.01, g);

  const paneW = (W - mull) / 2 - 0.04;
  const paneH = H - 0.08;
  for (const side of [-1, 1]) {
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(paneW, paneH), mats.glass);
    glass.position.set(side * (W / 4 + mull / 4), H / 2, depth * 0.12);
    g.add(glass);
    // thin sash border on each leaf (no mid horizontal rail)
    const lx = side * (W / 4 + mull / 4);
    const leafW = (W - mull) / 2;
    const ib = 0.05;
    box(leafW, ib, depth * 0.55, mats.frame, lx, ib / 2 + 0.02, 0.03, g);
    box(leafW, ib, depth * 0.55, mats.frame, lx, H - ib / 2 - 0.02, 0.03, g);
    box(ib, paneH, depth * 0.55, mats.frame, lx - leafW / 2 + ib / 2, H / 2, 0.03, g);
    box(ib, paneH, depth * 0.55, mats.frame, lx + leafW / 2 - ib / 2, H / 2, 0.03, g);
  }

  g.position.set(cx, P.windowSill, zFront + 0.06);
  world.add(g);

  const rect = new THREE.RectAreaLight(0xfff1de, P.windowLightIntensity, W * 0.92, H * 0.92);
  rect.position.set(cx, P.windowSill + H / 2, zFront + 0.25);
  rect.lookAt(cx, P.windowSill + H / 2, 0);
  world.add(rect);
  const glow = new THREE.PointLight(0xffe6c0, 10, 16, 2);
  glow.position.set(cx, P.windowSill + H * 0.55, zFront + 1.8);
  world.add(glow);
}

/** Entry door on right wall — frame sits proud of interior face (no z-fight with wall) */
function buildSideDoor(zCenter, halfW) {
  const g = new THREE.Group();
  const W = P.doorWidth, H = P.doorHeight;
  const ft = 0.12;   // jamb width along wall
  const fd = 0.15;   // frame depth into room
  // local +X is into the room (away from wall). Group origin on interior wall face.
  // head
  box(fd, ft, W + ft * 2, mats.frame, -fd / 2, H + ft / 2, 0, g);
  // jambs
  box(fd, H, ft, mats.frame, -fd / 2, H / 2, -W / 2 - ft / 2, g);
  box(fd, H, ft, mats.frame, -fd / 2, H / 2,  W / 2 + ft / 2, g);
  // door stop lips (thin, not filling the opening — avoids z-fight + solid block)
  box(0.03, H - 0.08, 0.04, mats.frame, -0.04, H / 2, -W / 2 + 0.02, g);
  box(0.03, H - 0.08, 0.04, mats.frame, -0.04, H / 2,  W / 2 - 0.02, g);
  box(0.03, 0.04, W - 0.08, mats.frame, -0.04, H - 0.06, 0, g);
  // door slab — offset into room, clear of wall mesh
  const slabT = 0.07;
  box(slabT, H - 0.14, W - 0.16, mats.door, -fd / 2 - 0.02, (H - 0.14) / 2, 0, g);
  const pm = new THREE.MeshStandardMaterial({ color: 0xe2ded6, roughness: 0.6 });
  box(0.03, 2.0, (W - 0.16) * 0.38, pm, -fd / 2 - 0.02 - slabT / 2 - 0.015, 1.3, 0, g);
  box(0.03, 1.6, (W - 0.16) * 0.38, pm, -fd / 2 - 0.02 - slabT / 2 - 0.015, 4.2, 0, g);
  // handle
  box(0.08, 0.35, 0.05, mats.metal, -fd / 2 - 0.08, 3.15, -W * 0.28, g);
  mesh(new THREE.SphereGeometry(0.07, 12, 12), mats.metal, -fd / 2 - 0.12, 3.3, -W * 0.28, g);

  // interior face of right wall
  g.position.set(halfW - WT - 0.005, 0, zCenter);
  world.add(g);
}

/**
 * Bathroom door on the wall that FACES THE MAIN ENTRY DOOR (x1 = toward windows / right wall).
 * You step out of the bath looking toward the entry door side of the room.
 * bathDoorAlong: 0 = near window wall, 1 = far end into the room (along Z).
 * Group local: +X = out of bath into room (toward main door), Z along wall.
 */
function buildBathDoor(bath, doorZc, doorW, doorH) {
  const g = new THREE.Group();
  const ft = 0.12;
  const fd = 0.15;
  // frame proud of x1 exterior into the room (+X world)
  // local +X = into room
  box(fd, ft, doorW + ft * 2, mats.frame, fd / 2, doorH + ft / 2, 0, g);
  box(fd, doorH, ft, mats.frame, fd / 2, doorH / 2, -doorW / 2 - ft / 2, g);
  box(fd, doorH, ft, mats.frame, fd / 2, doorH / 2,  doorW / 2 + ft / 2, g);
  box(0.03, doorH - 0.08, 0.04, mats.frame, 0.04, doorH / 2, -doorW / 2 + 0.02, g);
  box(0.03, doorH - 0.08, 0.04, mats.frame, 0.04, doorH / 2,  doorW / 2 - 0.02, g);
  box(0.03, 0.04, doorW - 0.08, mats.frame, 0.04, doorH - 0.06, 0, g);

  if (P.showBathDoor) {
    const hinge = new THREE.Group();
    const leafW = doorW - 0.14;
    const leafH = doorH - 0.14;
    const leafT = 0.06;
    // hinge at jamb toward window wall (−Z); leaf extends +Z in hinge space
    box(leafT, leafH, leafW, mats.door, -leafT / 2, leafH / 2, leafW / 2, hinge);
    const pm = new THREE.MeshStandardMaterial({ color: 0xe2ded6, roughness: 0.6 });
    box(0.025, leafH * 0.32, leafW * 0.42, pm, -leafT - 0.01, leafH * 0.32, leafW / 2, hinge);
    box(0.025, leafH * 0.28, leafW * 0.42, pm, -leafT - 0.01, leafH * 0.7, leafW / 2, hinge);
    const open = THREE.MathUtils.clamp(P.bathDoorOpen, 0, 1) * (Math.PI / 2) * 0.9;
    hinge.position.set(0.02, 0, -doorW / 2 + 0.07);
    hinge.rotation.y = open; // swing into bath (−X)
    g.add(hinge);
  }

  // exterior of bathroom wall toward main door / windows (x1)
  g.position.set(bath.x1 + 0.015, 0, doorZc);
  world.add(g);
}

function bareBulb(x, z, halfW) {
  const g = new THREE.Group();
  box(0.28, 0.07, 0.28, new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.55, metalness: 0.4 }), 0, 0, 0, g);
  mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.14, 12),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 }), 0, -0.1, 0, g);
  mesh(new THREE.SphereGeometry(0.13, 18, 18),
    new THREE.MeshStandardMaterial({ color: 0xfff2d4, emissive: 0xffc66a, emissiveIntensity: 2.0, roughness: 0.35 }),
    0, -0.3, 0, g);
  const light = new THREE.PointLight(0xffd9a0, P.bulbIntensity, 20, 1.55);
  light.position.set(0, -0.3, 0);
  light.castShadow = true;
  light.shadow.mapSize.set(1024, 1024);
  light.shadow.bias = -0.004;
  g.add(light);
  mesh(new THREE.SphereGeometry(0.4, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffe0a8, transparent: true, opacity: 0.12, depthWrite: false }),
    0, -0.3, 0, g).castShadow = false;
  // always on ridge centerline (x = 0)
  const bx = 0;
  g.position.set(bx, roofY(bx, halfW) - 0.08, z);
  world.add(g);
  bulbLights.push(light);
}

function addCollider(x0, x1, z0, z1) {
  colliders.push({ x0, x1, z0, z1 });
}

function windowLayout() {
  const pairCenter = 0;
  const win1X = pairCenter - P.windowGap / 2 - P.windowWidth / 2;
  const win2X = pairCenter + P.windowGap / 2 + P.windowWidth / 2;
  return {
    win1X, win2X,
    leftEdge: win1X - P.windowWidth / 2,
    rightEdge: win2X + P.windowWidth / 2,
  };
}

// ── free intervals helper ─────────────────────────────────────────
function freeIntervals(a0, a1, blocked) {
  const cuts = (blocked || [])
    .map((b) => ({ a0: Math.max(a0, b.a0), a1: Math.min(a1, b.a1) }))
    .filter((b) => b.a1 > b.a0)
    .sort((a, b) => a.a0 - b.a0);
  const free = [];
  let cur = a0;
  for (const b of cuts) {
    if (b.a0 > cur) free.push({ a0: cur, a1: b.a0 });
    cur = Math.max(cur, b.a1);
  }
  if (cur < a1) free.push({ a0: cur, a1: a1 });
  return free;
}

// Must match placeBassTraps: diagonal trap center offset from each corner
const BASS_TRAP_CORNER_INSET = 0.55;

/** Snap feet value to nearest allowed standard size */
function snapPanelSize(ft, allowed) {
  let best = allowed[0];
  let bestD = Math.abs(ft - best);
  for (const a of allowed) {
    const d = Math.abs(ft - a);
    if (d < bestD) { best = a; bestD = d; }
  }
  return best;
}

function panelW() { return snapPanelSize(P.panelWidth, [1, 2]); }   // 12" | 24"
function panelH() { return snapPanelSize(P.panelHeight, [2, 4]); }  // 24" | 48"
function trapW() { return P.trapWidth >= 1.5 ? 2 : 1; }             // 12" | 24"

/** Half-extent of a 45°-rotated trap box along a wall axis (AABB) */
function bassTrapHalfAlongWall() {
  return 0.5 * (trapW() + P.trapThickness) * Math.SQRT1_2;
}

/**
 * Distance from a room corner along a wall that must stay clear of panels:
 * reaches the far edge of the angled bass trap, then the same gap used between panels.
 * When traps are off (or this corner has no trap), falls back to panelMargin.
 * corner: 'fl' | 'fr' | 'bl' | 'br'  (fr = door corner)
 */
function cornerPanelClearance(corner) {
  if (!P.showBassTraps) return P.panelMargin;
  if (corner === 'fr' && !P.showBassTrapDoorCorner) return P.panelMargin;
  const trapEnd = BASS_TRAP_CORNER_INSET + bassTrapHalfAlongWall();
  return trapEnd + P.panelGap;
}

/** Place 24×48 panels along a 1D span, centered in each free segment.
 *  marginA0 / marginA1: clearance at span start / end (defaults to panelMargin).
 */
function placePanelsOnSpan(a0, a1, blocked, makePanel, marginA0, marginA1) {
  const pw = panelW();
  const gap = P.panelGap;
  const m0 = marginA0 != null ? marginA0 : P.panelMargin;
  const m1 = marginA1 != null ? marginA1 : m0;
  const free = freeIntervals(a0 + m0, a1 - m1, blocked);
  for (const seg of free) {
    const len = seg.a1 - seg.a0;
    if (len < pw) continue;
    let n = Math.floor((len + gap) / (pw + gap));
    if (n < 1) continue;
    const total = n * pw + (n - 1) * gap;
    const start = seg.a0 + (len - total) / 2;
    for (let i = 0; i < n; i++) makePanel(start + i * (pw + gap) + pw / 2);
  }
}

function wallPanelAt(cx, cy, cz, rotY) {
  // simple rectangular box — no oversized face plate
  const pw = panelW(), ph = panelH(), pt = P.panelThickness;
  const m = box(pw, ph, pt, mats.wallPanel, cx, cy, cz);
  m.rotation.y = rotY;
  return m;
}

function placeWallPanels(halfW, halfD, zFront, zBack, wins, bath, doorZ) {
  if (!P.showWallPanels) return;
  const cy = P.panelBottom + panelH() / 2;
  const inset = WT / 2 + P.panelThickness / 2 + 0.02;
  // per-corner clearances (fr = entry-door corner — often no trap)
  const cFL = cornerPanelClearance('fl');
  const cFR = cornerPanelClearance('fr');
  const cBL = cornerPanelClearance('bl');
  const cBR = cornerPanelClearance('br');

  // Left wall (x = -halfW), facing +X — a: -halfD (front/FL) → +halfD (back/BL)
  {
    const blocked = [];
    if (bath) {
      if (bath.x0 < -halfW + 1.0) {
        blocked.push({ a0: bath.z0, a1: bath.z1 });
      }
    }
    placePanelsOnSpan(-halfD, halfD, blocked, (z) => {
      wallPanelAt(-halfW + inset, cy, z, Math.PI / 2);
    }, cFL, cBL);
  }

  // Right wall (x = +halfW), facing -X — a: front/FR (door) → back/BR
  {
    const blocked = [];
    if (P.showDoor) {
      blocked.push({
        a0: doorZ - P.doorWidth / 2 - 0.15,
        a1: doorZ + P.doorWidth / 2 + 0.15
      });
    }
    placePanelsOnSpan(-halfD, halfD, blocked, (z) => {
      wallPanelAt(halfW - inset, cy, z, -Math.PI / 2);
    }, cFR, cBR);
  }

  // Back wall (z = +halfD), facing -Z — a: -halfW (BL) → +halfW (BR)
  {
    placePanelsOnSpan(-halfW, halfW, [], (x) => {
      wallPanelAt(x, cy, halfD - inset, Math.PI);
    }, cBL, cBR);
  }

  // Window wall (z = -halfD), facing +Z — a: -halfW (FL) → +halfW (FR/door)
  // No panels between windows and entry door (electrical panel there)
  {
    const blocked = [];
    if (P.showWindows) {
      blocked.push({
        a0: wins.leftEdge - 0.15,
        a1: wins.rightEdge + 0.15
      });
    }
    if (bath) {
      blocked.push({ a0: bath.x0 - 0.1, a1: bath.x1 + 0.1 });
    }
    // block entire run from windows to right wall (door + electrical)
    blocked.push({
      a0: wins.rightEdge - 0.05,
      a1: halfW + 1
    });
    placePanelsOnSpan(-halfW, halfW, blocked, (x) => {
      wallPanelAt(x, cy, -halfD + inset, 0);
    }, cFL, cFR);
  }

  // Bathroom EXTERIOR panels only — never inside
  if (bath && P.panelBottom + panelH() < bath.h - 0.1) {
    const bi = WT / 2 + P.panelThickness / 2 + 0.03;
    const doorZc = bath.doorZc != null ? bath.doorZc : bath.cz;
    const doorW = bath.doorW != null ? bath.doorW : Math.min(P.bathDoorWidth, bath.d - 0.8);
    const doorBlockZ = [{
      a0: doorZc - doorW / 2 - 0.15,
      a1: doorZc + doorW / 2 + 0.15
    }];
    const m = Math.min(P.panelMargin, 0.35);

    // end wall z1 (into room) — exterior only, solid
    placePanelsOnSpan(bath.x0, bath.x1, [], (x) => {
      wallPanelAt(x, cy, bath.z1 + bi, 0);
    }, m);

    // left exterior (x0) — exterior only
    placePanelsOnSpan(bath.z0, bath.z1, [], (z) => {
      wallPanelAt(bath.x0 - bi, cy, z, -Math.PI / 2);
    }, m);

    // window/main-door side exterior (x1) — skip bathroom door
    placePanelsOnSpan(bath.z0, bath.z1, doorBlockZ, (z) => {
      wallPanelAt(bath.x1 + bi, cy, z, Math.PI / 2);
    }, m);
  }

  // Horizontal panels in gable triangle above vertical row (non-window walls only)
  if (P.showHorizontalGablePanels && P.showWallPanels) {
    placeHorizontalGablePanels(halfW, halfD, cFL, cFR, cBL, cBR, doorZ);
  }
}

/** One horizontal 24×48 panel above the vertical row — BACK WALL ONLY (gable end opposite windows).
 *  Always rides just above the vertical row; free to sit up in the triangular gable — never culled for height.
 */
function placeHorizontalGablePanels(halfW, halfD, cFL, cFR, cBL, cBR, doorZ) {
  const pt = P.panelThickness;
  // sit just above the vertical panel row; landscape: long along wall
  const ph = panelH();
  const pw = panelW();
  const cy = P.panelBottom + ph + P.panelGap + pw / 2;

  const inset = WT / 2 + pt / 2 + 0.02;
  const lo = -halfW + cBL;
  const hi = halfW - cBR;
  if (hi - lo < ph * 0.5) return;
  const x = (lo + hi) / 2;

  const along = ph;
  const vert = pw;
  const m = box(along, vert, pt, mats.wallPanel, x, cy, halfD - inset);
  m.rotation.y = Math.PI;
}

/** Bass traps: 12|24 × 48, diagonal; optional stack of two floor→ceiling */
function placeBassTraps(halfW, halfD, bath) {
  if (!P.showBassTraps) return;
  const tw = trapW();
  const th = 4; // always 48" per unit
  const tt = P.trapThickness;
  const inset = BASS_TRAP_CORNER_INSET;
  const stack = P.twoBassTrapsPerCorner ? 2 : 1;
  const baseY = P.trapBottom;
  const maxTop = P.eavesHeight - 0.05;
  const useH = Math.min(th, (maxTop - baseY) / stack);

  const corners = [
    { id: 'fl', x: -halfW + inset, z: -halfD + inset, rot: Math.PI / 4 },
    { id: 'fr', x:  halfW - inset, z: -halfD + inset, rot: -Math.PI / 4 },
    { id: 'bl', x: -halfW + inset, z:  halfD - inset, rot: -Math.PI / 4 },
    { id: 'br', x:  halfW - inset, z:  halfD - inset, rot: Math.PI / 4 },
  ].filter((c) => c.id !== 'fr' || P.showBassTrapDoorCorner);

  // Exterior corner of bathroom into the room (OUTSIDE the bath shell)
  // Room-side of left face (x0) and room-side of end face (z1)
  if (P.showBassTrapBathCorner && bath) {
    corners.push({
      id: 'bath',
      x: bath.x0 - inset,
      z: bath.z1 + inset,
      rot: Math.PI / 4,
    });
  }

  for (const c of corners) {
    for (let s = 0; s < stack; s++) {
      const g = new THREE.Group();
      const h = useH;
      box(tw, h, tt, mats.bassTrap, 0, 0, 0, g);
      box(tw * 0.92, h * 0.98, tt * 0.55, mats.bassTrap, 0, 0, tt * 0.35, g);
      const bind = new THREE.MeshStandardMaterial({
        color: hex(P.colorBassTrap).multiplyScalar(0.88), roughness: 0.9
      });
      box(tw + 0.03, h + 0.03, 0.03, bind, 0, 0, -tt / 2, g);
      const cy = baseY + h / 2 + s * h;
      if (cy + h / 2 > maxTop + 0.01) break;
      g.position.set(c.x, cy, c.z);
      g.rotation.y = c.rot;
      world.add(g);
    }
  }
}

/**
 * 8 fabric panels on the vaulted ceiling — 4 per slope in a 2×2 grid.
 * Equal spacing on all sides of each slope (auto gap, not hand-tuned).
 */
function placeVaultPanels(halfW, halfD) {
  if (!P.showVaultPanels) return;
  const rise = P.peakHeight - P.eavesHeight;
  const run = halfW;
  const slopeLen = Math.hypot(run, rise);
  if (slopeLen < 0.5) return;

  // landscape: long edge along room (Z), short edge along slope
  const along = snapPanelSize(P.vaultPanelAlong, [1, 2]);
  const across = snapPanelSize(P.vaultPanelAcross, [2, 4]);
  const thick = P.vaultPanelThickness;
  const edgePad = Math.max(0, P.vaultPanelMargin); // min inset from edges; equal gaps fill the rest

  // usable rectangle per slope
  const sLo = edgePad;
  const sHi = slopeLen - edgePad;
  const zLo = -halfD + edgePad;
  const zHi = halfD - edgePad;
  const sSpan = sHi - sLo;
  const zSpan = zHi - zLo;
  if (sSpan < along * 2 || zSpan < across * 2) return;

  // equal spacing: 2 panels → 3 equal gaps (before, between, after)
  const sGap = (sSpan - 2 * along) / 3;
  const zGap = (zSpan - 2 * across) / 3;
  const sCenters = [
    sLo + sGap + along / 2,
    sLo + sGap + along + sGap + along / 2,
  ];
  const zCenters = [
    zLo + zGap + across / 2,
    zLo + zGap + across + zGap + across / 2,
  ];

  function placeOnSlope(side) {
    const slopeDir = new THREE.Vector3(
      side < 0 ? run / slopeLen : -run / slopeLen,
      rise / slopeLen,
      0
    );
    let normal = new THREE.Vector3().crossVectors(slopeDir, new THREE.Vector3(0, 0, 1));
    if (normal.y > 0) normal.negate();
    if (side < 0 && normal.x < 0) normal.negate();
    if (side > 0 && normal.x > 0) normal.negate();
    normal.normalize();

    const xAxis = slopeDir.clone().normalize();
    const yAxis = normal.clone().negate();
    const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
    xAxis.crossVectors(yAxis, zAxis).normalize();
    const quat = new THREE.Quaternion().setFromRotationMatrix(
      new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis)
    );

    for (const s of sCenters) {
      for (const z of zCenters) {
        const t = s / slopeLen;
        const x = side < 0 ? -halfW + t * run : halfW - t * run;
        const y = P.eavesHeight + t * rise;
        const pos = new THREE.Vector3(x, y, z).addScaledVector(normal, thick / 2 + 0.04);

        const m = box(along, thick, across, mats.vaultPanel, pos.x, pos.y, pos.z);
        m.quaternion.copy(quat);
      }
    }
  }

  placeOnSlope(-1);
  placeOnSlope(1);
}

/**
 * Ceiling clouds: auto-pack along room depth (Z), centered on ridge (x=0).
 * Uses cloud size + gap; gap 0 packs edge-to-edge for as many as fit.
 */
function placeCeilingClouds(halfW, halfD) {
  if (!P.showClouds) return;
  const cw = P.cloudWidth;   // along Z (length of each cloud)
  const cd = P.cloudDepth;   // along X (across ridge)
  const ct = P.cloudThickness;
  const ridgeY = P.peakHeight;
  const panelY = ridgeY - P.cloudHang;
  const gap = Math.max(0, P.cloudGap);
  const margin = Math.max(0, P.cloudMargin ?? 0.5);

  // available span along room depth
  const span = P.roomDepth - margin * 2;
  if (span < cw * 0.5) return;

  // how many fit: n * cw + (n-1) * gap <= span
  let n;
  if (gap <= 1e-6) {
    n = Math.max(1, Math.floor(span / cw + 1e-9));
  } else {
    n = Math.max(1, Math.floor((span + gap) / (cw + gap) + 1e-9));
  }
  // don't exceed what actually fits
  while (n > 1 && n * cw + (n - 1) * gap > span + 1e-6) n--;

  const total = n * cw + (n - 1) * gap;
  const startZ = -halfD + margin + (span - total) / 2; // center the pack in the room

  const wireLen = Math.max(0.3, ridgeY - 0.15 - (panelY + ct / 2));

  for (let i = 0; i < n; i++) {
    const z = startZ + cw / 2 + i * (cw + gap);
    const g = new THREE.Group();
    // simple box cloud panel
    box(cd, ct, cw, mats.ceilPanel, 0, 0, 0, g);

    const corners = [
      [-cd * 0.35, cw * 0.35],
      [ cd * 0.35, cw * 0.35],
      [-cd * 0.35, -cw * 0.35],
      [ cd * 0.35, -cw * 0.35],
    ];
    for (const [wx, wz] of corners) {
      const wire = mesh(
        new THREE.CylinderGeometry(0.012, 0.012, wireLen, 6),
        mats.wire,
        wx, ct / 2 + wireLen / 2, wz, g
      );
      wire.castShadow = false;
      mesh(new THREE.SphereGeometry(0.04, 8, 8), mats.metal, wx, ct / 2 + wireLen, wz, g);
    }

    g.position.set(0, panelY, z); // ridge axis x=0
    world.add(g);
  }
}

function disposeObject(obj) {
  obj.traverse((c) => {
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      const matsArr = Array.isArray(c.material) ? c.material : [c.material];
      for (const m of matsArr) {
        // don't dispose shared fabricTextures base — only clones on materials are per-build
        if (m.map && m.map !== fabricTextures?.map) m.map.dispose?.();
        m.dispose?.();
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════════════
function rebuild() {
  while (world.children.length) {
    const c = world.children[0];
    world.remove(c);
    disposeObject(c);
  }
  colliders = [];
  bulbLights = [];
  makeMaterials();

  if (P.peakHeight < P.eavesHeight + 0.5) P.peakHeight = P.eavesHeight + 0.5;

  const halfW = P.roomWidth / 2;
  const halfD = P.roomDepth / 2;
  const zFront = -halfD;
  const zBack = halfD;

  scene.background = new THREE.Color(0xcfc6b4);
  scene.fog = new THREE.FogExp2(0xcfc6b4, 0.012);

  const floor = mesh(new THREE.PlaneGeometry(P.roomWidth, P.roomDepth), mats.floor, 0, 0, 0);
  floor.rotation.x = -Math.PI / 2;
  floor.castShadow = false;

  addCeilingQuad(-halfW, 0, halfD);
  addCeilingQuad(halfW, 0, halfD);
  addRoofSkin(true, halfW, halfD);
  addRoofSkin(false, halfW, halfD);
  box(0.2, 0.1, P.roomDepth + 0.9,
    new THREE.MeshStandardMaterial({ color: 0x5c4a30, roughness: 0.85 }),
    0, P.peakHeight + 0.28, 0);

  const wins = windowLayout();
  const winBot = P.windowSill;
  const winTop = P.windowSill + P.windowHeight;

  // ── Room walls with clean corner butts ──────────────────────────
  // Front/back: full width. Sides: shortened by WT so they meet edges.

  // Window wall (front)
  {
    const zc = zFront + WT / 2;
    const openings = [];
    if (P.showWindows) {
      openings.push({ x0: wins.win1X - P.windowWidth / 2, x1: wins.win1X + P.windowWidth / 2, y0: winBot, y1: winTop });
      openings.push({ x0: wins.win2X - P.windowWidth / 2, x1: wins.win2X + P.windowWidth / 2, y0: winBot, y1: winTop });
    }
    openings.sort((a, b) => a.x0 - b.x0);
    let cur = -halfW;
    for (const op of openings) {
      const x0 = Math.max(op.x0, -halfW), x1 = Math.min(op.x1, halfW);
      if (x1 <= x0) continue;
      wallStripX(cur, x0, 0, P.eavesHeight, zc);
      wallStripX(x0, x1, 0, op.y0, zc);
      wallStripX(x0, x1, op.y1, P.eavesHeight, zc);
      cur = x1;
    }
    wallStripX(cur, halfW, 0, P.eavesHeight, zc);
    gableFill(zc, halfW); // same plane & material as window wall
  }

  // exterior view through windows (garden / pink house photo)
  placeExteriorBackdrop(zFront, wins);

  if (P.showWindows) {
    casementWindow(wins.win1X, zFront);
    casementWindow(wins.win2X, zFront);
  }

  // Back wall full width + gable (same center plane as wall strip)
  {
    const zc = zBack - WT / 2;
    wallStripX(-halfW, halfW, 0, P.eavesHeight, zc);
    gableFill(zc, halfW);
  }

  // Left wall — shortened Z so corners butt front/back
  wallStripZ(zFront + WT, zBack - WT, 0, P.eavesHeight, -halfW + WT / 2);

  // Right wall + door
  let doorZ = zFront + P.doorFromFront + P.doorWidth / 2;
  {
    const xc = halfW - WT / 2;
    const z0 = zFront + WT, z1 = zBack - WT;
    if (P.showDoor) {
      const d0 = doorZ - P.doorWidth / 2;
      const d1 = doorZ + P.doorWidth / 2;
      wallStripZ(z0, d0, 0, P.eavesHeight, xc);
      wallStripZ(d1, z1, 0, P.eavesHeight, xc);
      wallStripZ(d0, d1, P.doorHeight, P.eavesHeight, xc);
      buildSideDoor(doorZ, halfW);
    } else {
      wallStripZ(z0, z1, 0, P.eavesHeight, xc);
    }
  }

  // ── Bathroom shell (clean corners) ──────────────────────────────
  let bath = null;
  if (P.showBathroom) {
    bath = {
      // right edge sits left of windows by bathWindowGap (default 2")
      x1: wins.leftEdge - P.bathWindowGap,
      x0: wins.leftEdge - P.bathWindowGap - P.bathWidth,
      z0: zFront + WT,
      z1: zFront + WT + P.bathDepth,
      h: Math.min(P.bathHeight, P.eavesHeight - 0.25),
    };
    bath.x0 = Math.max(bath.x0, -halfW + WT);
    bath.w = bath.x1 - bath.x0;
    bath.d = bath.z1 - bath.z0;
    bath.cx = (bath.x0 + bath.x1) / 2;
    bath.cz = (bath.z0 + bath.z1) / 2;

    // Door on wall facing MAIN ENTRY (x1 → toward windows / right wall)
    const doorW = Math.min(P.bathDoorWidth, bath.d - 0.8);
    const doorH = Math.min(P.bathDoorHeight, bath.h - 0.15);
    const along = THREE.MathUtils.clamp(P.bathDoorAlong, 0.15, 0.85);
    const doorZc = THREE.MathUtils.clamp(
      bath.z0 + bath.d * along,
      bath.z0 + doorW / 2 + 0.25,
      bath.z1 - doorW / 2 - 0.25
    );

    buildShellWalls(bath.x0, bath.x1, bath.z0, bath.z1, bath.h, [
      { wall: 'x1', a0: doorZc - doorW / 2, a1: doorZc + doorW / 2, y0: 0, y1: doorH }
    ]);

    buildBathDoor(bath, doorZc, doorW, doorH);

    bath.doorZc = doorZc;
    bath.doorW = doorW;
    bath.doorH = doorH;

    const bl = new THREE.PointLight(0xfff4e5, 5, 10, 2);
    bl.position.set(bath.cx, bath.h - 0.35, bath.cz);
    world.add(bl);

    // colliders: solid left + end walls; right wall has door gap
    addCollider(bath.x0 - 0.1, bath.x0 + WT + 0.15, bath.z0, bath.z1);
    addCollider(bath.x0, bath.x1, bath.z1 - WT - 0.1, bath.z1 + 0.15);
    addCollider(bath.x1 - WT - 0.15, bath.x1 + 0.1, bath.z0, doorZc - doorW / 2 - 0.1);
    addCollider(bath.x1 - WT - 0.15, bath.x1 + 0.1, doorZc + doorW / 2 + 0.1, bath.z1);
  }

  // baseboards (inset, clean miters via shortened sides)
  const bh = 0.32, bd = 0.04;
  box(P.roomWidth - WT * 2, bh, bd, mats.trim, 0, bh / 2, -halfD + WT + 0.02);
  box(P.roomWidth - WT * 2, bh, bd, mats.trim, 0, bh / 2,  halfD - WT - 0.02);
  box(bd, bh, P.roomDepth - WT * 2, mats.trim, -halfW + WT + 0.02, bh / 2, 0);
  box(bd, bh, P.roomDepth - WT * 2, mats.trim,  halfW - WT - 0.02, bh / 2, 0);

  bareBulb(0, P.bulb1Z, halfW);
  bareBulb(0, P.bulb2Z, halfW);

  // ── Acoustic treatment ──────────────────────────────────────────
  placeWallPanels(halfW, halfD, zFront, zBack, wins, bath, doorZ);
  placeBassTraps(halfW, halfD, bath);
  placeVaultPanels(halfW, halfD);
  placeCeilingClouds(halfW, halfD);

  // outer colliders
  const M = 0.45;
  addCollider(-halfW - 2, -halfW + M, -halfD - 2, halfD + 2);
  addCollider(halfW - M, halfW + 2, -halfD - 2, halfD + 2);
  addCollider(-halfW - 2, halfW + 2, -halfD - 2, -halfD + M);
  addCollider(-halfW - 2, halfW + 2, halfD - M, halfD + 2);

  updateSceneLights();

  const obj = controls.getObject();
  obj.position.x = THREE.MathUtils.clamp(obj.position.x, -halfW + 0.6, halfW - 0.6);
  obj.position.z = THREE.MathUtils.clamp(obj.position.z, -halfD + 0.6, halfD - 0.6);
  obj.position.y = P.eyeHeight;

  requestRender();
}

// ── lights ────────────────────────────────────────────────────────
const ambLight = new THREE.AmbientLight(0xfff6ea, P.ambientIntensity);
scene.add(ambLight);
const hemiLight = new THREE.HemisphereLight(0xfff2dc, 0xb8a990, 0.45);
scene.add(hemiLight);
const sunLight = new THREE.DirectionalLight(0xffe6c0, P.sunIntensity);
sunLight.position.set(-2, 14, -18);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 2, far: 50 });
sunLight.shadow.bias = -0.001;
scene.add(sunLight);
const bounceLight = new THREE.DirectionalLight(0xfff0e0, 0.22);
bounceLight.position.set(4, 3, 10);
scene.add(bounceLight);
const ceilBounce = new THREE.PointLight(0xd4a85c, 4, 22, 2);
ceilBounce.position.set(0, 9.5, 0);
scene.add(ceilBounce);

function updateSceneLights() {
  ambLight.intensity = P.ambientIntensity;
  sunLight.intensity = P.sunIntensity;
  ceilBounce.color.set(P.colorCeiling);
  ceilBounce.position.y = P.peakHeight - 1.5;
  for (const b of bulbLights) b.intensity = P.bulbIntensity;
}

// ── controls ──────────────────────────────────────────────────────
const controls = new PointerLockControls(camera, document.body);
const panelEl = document.getElementById('panel');
const toggleBtn = document.getElementById('panel-toggle');

function setPanelCollapsed(collapsed) {
  panelEl.classList.toggle('collapsed', collapsed);
  document.body.classList.toggle('panel-collapsed', collapsed);
  toggleBtn.textContent = collapsed ? 'Params' : 'Hide';
  toggleBtn.setAttribute('aria-expanded', String(!collapsed));
  try { localStorage.setItem('music-studio-panel-collapsed', collapsed ? '1' : '0'); } catch (_) {}
}
function togglePanel() {
  setPanelCollapsed(!panelEl.classList.contains('collapsed'));
}

// restore panel open/closed
try {
  setPanelCollapsed(localStorage.getItem('music-studio-panel-collapsed') === '1');
} catch (_) {
  setPanelCollapsed(false);
}

// click the scene (not UI) to enter walk mode
renderer.domElement.addEventListener('click', () => {
  if (!controls.isLocked) controls.lock();
});
controls.addEventListener('lock', () => requestRender());
controls.addEventListener('unlock', () => requestRender());

const keys = Object.create(null);
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyP' && !e.metaKey && !e.ctrlKey) {
    togglePanel();
    e.preventDefault();
  }
  if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code) && controls.isLocked) {
    e.preventDefault();
    requestRender();
  }
});
addEventListener('keyup', (e) => {
  keys[e.code] = false;
  if (['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) requestRender();
});

function hitsCollider(x, z) {
  for (const c of colliders) {
    if (x > c.x0 && x < c.x1 && z > c.z0 && z < c.z1) return true;
  }
  return false;
}

const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
let prev = performance.now();
let needsRender = true;
let animating = false; // rAF loop only runs while something needs frames

function requestRender() {
  needsRender = true;
  if (!animating) {
    animating = true;
    prev = performance.now();
    requestAnimationFrame(animate);
  }
}

controls.getObject().position.set(2, P.eyeHeight, 4);

// camera look / move from pointer lock
controls.addEventListener('change', requestRender);

function animate(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;

  let stillMoving = false;

  if (controls.isLocked) {
    const sprint = keys.ShiftLeft || keys.ShiftRight;
    const speed = sprint ? P.sprintSpeed : P.walkSpeed;
    const wantMove = keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD;

    velocity.x -= velocity.x * 10 * dt;
    velocity.z -= velocity.z * 10 * dt;
    direction.z = Number(!!keys.KeyW) - Number(!!keys.KeyS);
    direction.x = Number(!!keys.KeyD) - Number(!!keys.KeyA);
    direction.normalize();
    if (keys.KeyW || keys.KeyS) velocity.z -= direction.z * speed * 12 * dt;
    if (keys.KeyA || keys.KeyD) velocity.x -= direction.x * speed * 12 * dt;

    const speed2 = velocity.x * velocity.x + velocity.z * velocity.z;
    if (wantMove || speed2 > 1e-6) {
      stillMoving = true;
      const obj = controls.getObject();
      const before = obj.position.clone();
      controls.moveRight(-velocity.x * dt);
      controls.moveForward(-velocity.z * dt);
      obj.position.y = P.eyeHeight;
      if (hitsCollider(obj.position.x, obj.position.z)) {
        const tx = obj.position.x, tz = obj.position.z;
        obj.position.x = before.x;
        if (hitsCollider(obj.position.x, tz)) {
          obj.position.z = before.z;
          obj.position.x = tx;
          if (hitsCollider(tx, obj.position.z)) obj.position.copy(before);
        }
      }
      needsRender = true;
    } else {
      velocity.set(0, 0, 0);
    }
  }

  if (needsRender) {
    renderer.render(scene, camera);
    needsRender = false;
  }

  if (stillMoving || needsRender) {
    requestAnimationFrame(animate);
  } else {
    animating = false;
    // if a requestRender raced in while we were finishing, restart
    if (needsRender) requestRender();
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  requestRender();
});

// ── UI ────────────────────────────────────────────────────────────
const toast = document.getElementById('toast');
let toastTimer = 0;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

let rebuildTimer = 0;
function scheduleRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(() => {
    rebuild();
    saveParams();
  }, 40);
  // save immediately too so mid-drag values aren't lost if the tab closes
  saveParams();
}

function fmt(v, unit = '′') {
  if (unit === '×') return Number(v).toFixed(2);
  if (unit === '"') return (Number(v) * 12).toFixed(1) + '"';
  if (Number.isInteger(v)) return v + unit;
  return Number(v).toFixed(2) + unit;
}

/**
 * unit: 'ft' | 'in' | 'x' | 'frac'
 * For 'in', min/max/step are in inches; P[key] stays feet.
 */
function slider(parent, key, label, min, max, step, unit = 'ft') {
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  lab.textContent = label;
  const val = document.createElement('div');
  val.className = 'value';
  const input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = step;

  const toDisplay = (feet) => {
    if (unit === 'in') return (feet * 12).toFixed(1) + '"';
    if (unit === 'x') return Number(feet).toFixed(2);
    if (unit === 'frac') return Number(feet).toFixed(2);
    return fmt(feet, '′');
  };
  const fromInput = (raw) => (unit === 'in' ? raw / 12 : raw);
  const toInput = (feet) => (unit === 'in' ? feet * 12 : feet);

  input.value = toInput(P[key]);
  val.textContent = toDisplay(P[key]);

  input.addEventListener('input', () => {
    P[key] = fromInput(parseFloat(input.value));
    val.textContent = toDisplay(P[key]);
    if (['bulbIntensity','ambientIntensity','sunIntensity'].includes(key)) {
      updateSceneLights();
      requestRender();
      saveParams();
      return;
    }
    if (key === 'eyeHeight') {
      controls.getObject().position.y = P.eyeHeight;
      requestRender();
      saveParams();
      return;
    }
    if (key === 'walkSpeed' || key === 'sprintSpeed') {
      saveParams();
      return;
    }
    scheduleRebuild();
  });
  input.addEventListener('mousedown', (e) => e.stopPropagation());
  row.append(lab, val, input);
  parent.appendChild(row);
}

function colorInput(parent, key, label) {
  const row = document.createElement('div');
  row.className = 'row full';
  const lab = document.createElement('label');
  lab.textContent = label;
  lab.style.cssText = 'margin-bottom:4px;display:block';
  const input = document.createElement('input');
  input.type = 'color';
  input.value = P[key];
  input.addEventListener('input', () => {
    P[key] = input.value;
    scheduleRebuild();
  });
  input.addEventListener('mousedown', (e) => e.stopPropagation());
  row.append(lab, input);
  parent.appendChild(row);
}

function checkbox(parent, key, label) {
  const row = document.createElement('label');
  row.className = 'check-row';
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = !!P[key];
  input.addEventListener('change', () => {
    P[key] = input.checked;
    scheduleRebuild();
  });
  input.addEventListener('mousedown', (e) => e.stopPropagation());
  row.append(input, document.createTextNode(label));
  parent.appendChild(row);
}

/** Discrete choice — options: [{ value: feet, label: '24"' }, ...] */
function choice(parent, key, label, options) {
  const row = document.createElement('div');
  row.className = 'choice-row';
  const lab = document.createElement('label');
  lab.textContent = label;
  const btns = document.createElement('div');
  btns.className = 'choice-btns';
  const refresh = () => {
    btns.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('active', Math.abs(parseFloat(b.dataset.v) - P[key]) < 1e-6);
    });
  };
  for (const opt of options) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = opt.label;
    btn.dataset.v = String(opt.value);
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      P[key] = opt.value;
      refresh();
      scheduleRebuild();
    });
    btn.addEventListener('mousedown', (e) => e.stopPropagation());
    btns.appendChild(btn);
  }
  refresh();
  row.append(lab, btns);
  parent.appendChild(row);
}

function folder(title, open = true) {
  const f = document.createElement('div');
  f.className = 'folder' + (open ? '' : ' closed');
  const t = document.createElement('div');
  t.className = 'folder-title';
  t.innerHTML = `<span>${title}</span><span class="chev">▼</span>`;
  t.addEventListener('click', () => f.classList.toggle('closed'));
  const body = document.createElement('div');
  body.className = 'folder-body';
  f.append(t, body);
  panelEl.appendChild(f);
  return body;
}

function buildPanel() {
  panelEl.innerHTML = '';
  const header = document.createElement('header');
  header.innerHTML = `<h2>Studio Params</h2><div class="actions"></div>`;
  const actions = header.querySelector('.actions');
  const resetBtn = document.createElement('button');
  resetBtn.textContent = 'Reset';
  resetBtn.addEventListener('click', () => {
    Object.assign(P, DEFAULTS);
    buildPanel();
    rebuild();
    saveParams();
    showToast('Reset to defaults');
  });
  const copyBtn = document.createElement('button');
  copyBtn.textContent = 'Copy JSON';
  copyBtn.title = `Copy params — paste into ${REPO_PARAMS_FILE} in the repo`;
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(exportParamsJSON());
      showToast(`Copied — paste into ${REPO_PARAMS_FILE}`);
    } catch { showToast('Copy failed'); }
  });
  const exportBtn = document.createElement('button');
  exportBtn.textContent = 'Export';
  exportBtn.title = `Download ${REPO_PARAMS_FILE} — put it in the repo root`;
  exportBtn.addEventListener('click', () => {
    downloadParamsJSON();
    showToast(`Downloaded ${REPO_PARAMS_FILE}`);
  });
  const loadFileBtn = document.createElement('button');
  loadFileBtn.textContent = 'Load file';
  loadFileBtn.title = `Reload ${REPO_PARAMS_FILE} from the repo (overwrites local)`;
  loadFileBtn.addEventListener('click', async () => {
    Object.assign(P, DEFAULTS);
    const ok = await loadRepoParams();
    if (!ok) {
      showToast(`No params in ${REPO_PARAMS_FILE}`);
      buildPanel();
      rebuild();
      return;
    }
    saveParams();
    buildPanel();
    rebuild();
    showToast(`Loaded ${REPO_PARAMS_FILE}`);
  });
  const collapseBtn = document.createElement('button');
  collapseBtn.textContent = '✕';
  collapseBtn.title = 'Collapse panel (P)';
  collapseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setPanelCollapsed(true);
  });
  actions.append(resetBtn, copyBtn, exportBtn, loadFileBtn, collapseBtn);
  panelEl.appendChild(header);

  let b = folder('Room');
  const rh = document.createElement('div');
  rh.className = 'hint-text';
  rh.textContent = `Room shell in feet; other sizes in inches. Export/Copy JSON → save as ${REPO_PARAMS_FILE} in the repo (others load it automatically). Local tweaks still save to this browser.`;
  b.appendChild(rh);
  slider(b, 'roomWidth', 'Width (window wall)', 10, 40, 0.25, 'ft');
  slider(b, 'roomDepth', 'Depth', 10, 40, 0.25, 'ft');
  slider(b, 'eavesHeight', 'Height at corners', 6, 12, 0.1, 'ft');
  slider(b, 'peakHeight', 'Height at ridge', 7, 16, 0.1, 'ft');

  b = folder('Windows');
  checkbox(b, 'showWindows', 'Show windows');
  slider(b, 'windowWidth', 'Width each', 24, 96, 1, 'in');
  slider(b, 'windowHeight', 'Height', 24, 84, 1, 'in');
  slider(b, 'windowGap', 'Gap between', 4, 48, 1, 'in');
  slider(b, 'windowSill', 'Sill height', 6, 60, 1, 'in');

  b = folder('Entry Door (right wall)');
  checkbox(b, 'showDoor', 'Show door');
  slider(b, 'doorWidth', 'Width', 24, 48, 1, 'in');
  slider(b, 'doorHeight', 'Height', 60, 96, 1, 'in');
  slider(b, 'doorFromFront', 'From window wall', 4, 144, 1, 'in');

  b = folder('Bathroom');
  checkbox(b, 'showBathroom', 'Show bathroom');
  checkbox(b, 'showBathDoor', 'Show door leaf');
  slider(b, 'bathWidth', 'Width (along windows)', 36, 144, 1, 'in');
  slider(b, 'bathDepth', 'Depth into room', 36, 168, 1, 'in');
  slider(b, 'bathHeight', 'Wall height', 60, 120, 1, 'in');
  slider(b, 'bathWindowGap', 'Gap to windows', 0, 12, 1, 'in');
  slider(b, 'bathDoorWidth', 'Doorway width', 24, 48, 1, 'in');
  slider(b, 'bathDoorHeight', 'Doorway height', 60, 96, 1, 'in');
  const bdh = document.createElement('div');
  bdh.className = 'hint-text';
  bdh.textContent = 'Door is on the bath wall facing the main entry (toward windows). Position slides along that wall.';
  b.appendChild(bdh);
  slider(b, 'bathDoorAlong', 'Door pos (window wall → into room)', 0.15, 0.85, 0.02, 'frac');
  slider(b, 'bathDoorOpen', 'Door open amount', 0, 1, 0.05, 'frac');

  b = folder('Wall Panels');
  checkbox(b, 'showWallPanels', 'Show wall panels');
  checkbox(b, 'showHorizontalGablePanels', 'Horizontal panel in gable (back wall)');
  const ph = document.createElement('div');
  ph.className = 'hint-text';
  ph.textContent = 'Standard sizes only. Horizontal gable panel on back wall only. Bathroom exterior only — never inside.';
  b.appendChild(ph);
  choice(b, 'panelWidth', 'Width', [
    { value: 1, label: '12"' },
    { value: 2, label: '24"' },
  ]);
  choice(b, 'panelHeight', 'Height', [
    { value: 2, label: '24"' },
    { value: 4, label: '48"' },
  ]);
  slider(b, 'panelGap', 'Gap between', 1, 24, 0.5, 'in');
  slider(b, 'panelBottom', 'Bottom height', 0, 60, 1, 'in');
  slider(b, 'panelMargin', 'End margin', 1, 24, 0.5, 'in');
  slider(b, 'panelThickness', 'Thickness', 1, 6, 0.25, 'in');

  b = folder('Bass Traps');
  checkbox(b, 'showBassTraps', 'Show corner bass traps');
  checkbox(b, 'twoBassTrapsPerCorner', 'Two per corner (floor→ceiling)');
  checkbox(b, 'showBassTrapBathCorner', 'Trap at bathroom corner');
  checkbox(b, 'showBassTrapDoorCorner', 'Trap at entry-door corner');
  const bth = document.createElement('div');
  bth.className = 'hint-text';
  bth.textContent = 'Height is always 48" per unit. Door-corner off by default; bath corner on by default.';
  b.appendChild(bth);
  choice(b, 'trapWidth', 'Width', [
    { value: 1, label: '12"' },
    { value: 2, label: '24"' },
  ]);
  slider(b, 'trapThickness', 'Depth', 3, 18, 0.5, 'in');
  slider(b, 'trapBottom', 'Bottom height', 0, 36, 1, 'in');

  b = folder('Vault Ceiling Panels');
  checkbox(b, 'showVaultPanels', 'Show vault panels (8)');
  const vh = document.createElement('div');
  vh.className = 'hint-text';
  vh.textContent = '4 per slope in a 2×2 landscape grid. Gaps auto-equal on all sides.';
  b.appendChild(vh);
  choice(b, 'vaultPanelAlong', 'Along slope', [
    { value: 1, label: '12"' },
    { value: 2, label: '24"' },
  ]);
  choice(b, 'vaultPanelAcross', 'Along room (long)', [
    { value: 2, label: '24"' },
    { value: 4, label: '48"' },
  ]);
  slider(b, 'vaultPanelMargin', 'Min edge margin', 0, 48, 1, 'in');
  slider(b, 'vaultPanelThickness', 'Thickness', 1, 6, 0.25, 'in');

  b = folder('Ceiling Clouds');
  checkbox(b, 'showClouds', 'Show hanging clouds');
  const ch = document.createElement('div');
  ch.className = 'hint-text';
  ch.textContent = 'Auto-packs along room depth on the ridge. Gap 0 = edge-to-edge as many as fit.';
  b.appendChild(ch);
  slider(b, 'cloudWidth', 'Length (along room)', 24, 120, 1, 'in');
  slider(b, 'cloudDepth', 'Width (across ridge)', 12, 72, 1, 'in');
  slider(b, 'cloudHang', 'Drop below ridge', 6, 48, 1, 'in');
  slider(b, 'cloudGap', 'Gap between clouds', 0, 96, 1, 'in');
  slider(b, 'cloudMargin', 'End margin (walls)', 0, 48, 1, 'in');
  slider(b, 'cloudThickness', 'Thickness', 1, 6, 0.25, 'in');

  b = folder('Lighting', false);
  slider(b, 'bulbIntensity', 'Bulb intensity', 5, 60, 0.5, 'x');
  slider(b, 'windowLightIntensity', 'Window light', 0, 15, 0.25, 'x');
  slider(b, 'ambientIntensity', 'Ambient', 0, 1.5, 0.02, 'x');
  slider(b, 'sunIntensity', 'Sun', 0, 3, 0.05, 'x');
  const blh = document.createElement('div');
  blh.className = 'hint-text';
  blh.textContent = 'Bulbs sit on the ridge centerline (X = 0). Only Z is adjustable.';
  b.appendChild(blh);
  slider(b, 'bulb1Z', 'Bulb 1 Z', -120, 120, 1, 'in');
  slider(b, 'bulb2Z', 'Bulb 2 Z', -120, 120, 1, 'in');

  b = folder('Colours');
  colorInput(b, 'colorCeiling', 'Ceiling (India Yellow)');
  colorInput(b, 'colorWalls', 'Walls (Matchstick)');
  colorInput(b, 'colorFloor', 'Floor');
  colorInput(b, 'colorFrame', 'Frames');
  colorInput(b, 'colorWallPanel', 'Wall panel fabric');
  colorInput(b, 'colorCeilingPanel', 'Ceiling cloud fabric');
  colorInput(b, 'colorVaultPanel', 'Vault panel fabric (Matchstick)');
  colorInput(b, 'colorBassTrap', 'Bass trap fabric');

  b = folder('Player', false);
  slider(b, 'eyeHeight', 'Eye height', 48, 84, 1, 'in');
  slider(b, 'walkSpeed', 'Walk speed', 2, 15, 0.25, 'x');
  slider(b, 'sprintSpeed', 'Sprint speed', 5, 25, 0.25, 'x');

  panelEl.addEventListener('mousedown', (e) => e.stopPropagation());
  panelEl.addEventListener('click', (e) => e.stopPropagation());
  panelEl.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true });
}

toggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  togglePanel();
});

// Load order: code DEFAULTS → studio-params.json (repo) → localStorage (this browser)
(async function bootstrap() {
  const fromRepo = await loadRepoParams();
  const fromLocal = loadLocalParams();
  buildPanel();
  rebuild();
  if (fromRepo && !fromLocal) {
    showToast(`Loaded ${REPO_PARAMS_FILE}`);
  }
})();
  </script>
